name: Archive integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Validate archive metadata
        run: node --experimental-strip-types scripts/check_archive.mjs
      - name: Test metadata and evidence preservation
        run: npm test
      - name: Test explicit import dates and permanent IDs
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check importer syntax
        run: python -m compileall -q scripts
